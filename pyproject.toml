[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "member-space-platform-iam"
version = "0.1.0"
description = "会员空间平台 · IAM：扫码登录适配器接口、state 校验与身份绑定流程"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "pydantic>=2.5",
    "alembic>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.21",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.iam", "app.api.iam.auth", "app.api.iam.me", "app.core", "app.iam", "app.iam.auth", "app.iam.auth.qr", "app.iam.roles"]

[tool.setuptools.package-data]
"app.iam.roles" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
