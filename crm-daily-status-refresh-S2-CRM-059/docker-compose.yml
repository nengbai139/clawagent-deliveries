# 验收环境：PostgreSQL 16（客户统一技术约定同大版本）+ Redis 7（并发锁）
#
# 用法：
#   docker compose up -d
#   export CRM_DATABASE_URL="postgresql+psycopg://app:app@127.0.0.1:55433/app"
#   export TEST_DATABASE_URL="$CRM_DATABASE_URL"
#   export CRM_REDIS_URL="redis://127.0.0.1:16380/0"
#   .venv/bin/python -m alembic upgrade head
#   .venv/bin/python -m pytest tests/ -v
#
# ⚠️ 端口用 55433 / 16380 ⇒ 不和本机已有的 PostgreSQL(5432) / Redis(6379) 撞。

services:
  db:
    image: postgres:16-alpine
    container_name: crmjob-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - crmjob_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crmjob-redis
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  crmjob_pgdata:
