[project]
name = "crm-daily-status-refresh"
version = "0.1.0"
description = "会员空间平台 · 日终状态刷新任务：会籍到期、合同到期与回款逾期批量派生（S2-CRM-059）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
